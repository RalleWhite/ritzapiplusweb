services:
  postgres:
    image: postgres:16-alpine
    container_name: ritz_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ritz_user
      POSTGRES_PASSWORD: ritz_password
      POSTGRES_DB: ritz_hotel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata:
